---
- name: Ensure private backup and helper directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ xui_backup_dir }}"
    - /usr/local/libexec/vipen

- name: Install database and recovery bundle helpers
  ansible.builtin.copy:
    src: "{{ role_path }}/../xui/files/{{ item }}"
    dest: "/usr/local/libexec/vipen/{{ item }}"
    owner: root
    group: root
    mode: "0700"
  loop: [xui_db.py, xui_backup.py]

- name: Install bounded backup script
  ansible.builtin.template:
    src: xui-backup.j2
    dest: "{{ xui_backup_script_path }}"
    owner: root
    group: root
    mode: "0700"

- name: Check existing database
  ansible.builtin.stat:
    path: "{{ xui_db_dir }}/x-ui.db"
  register: backup_xui_db

- name: Save a consistent recovery bundle before deployment
  ansible.builtin.command: "{{ xui_backup_script_path }}"
  register: backup_bundle
  changed_when: true
  when:
    - backup_xui_db.stat.exists
    - not ansible_check_mode

- name: Keep an off-host recovery bundle on remote runs
  when:
    - not (run_is_local | bool)
    - backup_xui_db.stat.exists
    - not ansible_check_mode
  block:
    - name: Create private controller backup directory
      ansible.builtin.file:
        path: "{{ backup_local_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Fetch verified database and recovery archive
      ansible.builtin.fetch:
        src: "{{ item }}"
        dest: "{{ backup_local_dir }}/"
        flat: true
      loop:
        - "{{ (backup_bundle.stdout | from_json).database }}"
        - "{{ (backup_bundle.stdout | from_json).bundle }}"

    - name: Restrict controller backup files
      ansible.builtin.file:
        path: "{{ backup_local_dir }}/{{ item | basename }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      loop:
        - "{{ (backup_bundle.stdout | from_json).database }}"
        - "{{ (backup_bundle.stdout | from_json).bundle }}"

- name: Explain the remaining off-host backup requirement on local runs
  ansible.builtin.debug:
    msg: "Recovery bundles in {{ xui_backup_dir }} are on the same disk. Configure encrypted off-host copies and test restoration."
  when: run_is_local | bool

- name: Install scheduled backup service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [xui-backup.service, xui-backup.timer]
  register: backup_units
  when: xui_backup_timer_enabled | bool

- name: Enable scheduled backup timer and apply schedule changes
  ansible.builtin.systemd:
    name: xui-backup.timer
    enabled: true
    state: "{{ 'restarted' if backup_units.changed else 'started' }}"
    daemon_reload: true
  when:
    - xui_backup_timer_enabled | bool
    - not ansible_check_mode

- name: Detect disabled backup units
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop: [xui-backup.timer, xui-backup.service]
  register: backup_disabled_units
  when: not (xui_backup_timer_enabled | bool)

- name: Stop both the timer and an active backup when disabled
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    enabled: false
    state: stopped
  loop: "{{ backup_disabled_units.results | default([]) }}"
  when:
    - not (xui_backup_timer_enabled | bool)
    - item.stat.exists | default(false)
    - not ansible_check_mode

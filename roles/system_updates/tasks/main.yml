---
- name: Refresh apt cache before system updates
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 1800
  when:
    - system_updates_enabled | bool
    - not ansible_check_mode

- name: Upgrade installed packages safely
  ansible.builtin.apt:
    upgrade: safe
  when:
    - system_updates_enabled | bool
    - not ansible_check_mode

- name: Remove unused apt packages
  ansible.builtin.apt:
    autoremove: true
  when:
    - system_updates_enabled | bool
    - not ansible_check_mode

# The apt module hardcodes changed=true for `clean`, with no detection of
# whether anything was actually evicted. Reported honestly it would mean "the
# downloaded .deb archives are gone" - and those are a cache, not part of the
# server's configured state, so the flag carries no information about the host
# either way. Left as-is it just makes every run report a change.
- name: Clean apt package cache
  ansible.builtin.apt:
    clean: true
  changed_when: false
  when:
    - system_updates_enabled | bool
    - not ansible_check_mode

- name: Check whether reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: system_updates_reboot_required

- name: Report reboot requirement
  ansible.builtin.debug:
    msg: "Reboot required: {{ system_updates_reboot_required.stat.exists }}"

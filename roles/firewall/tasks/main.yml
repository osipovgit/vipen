---
- name: Ensure firewall helper directory exists
  ansible.builtin.file:
    path: /usr/local/libexec/vipen
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install scoped firewall reconciler
  ansible.builtin.copy:
    src: ufw_rules.py
    dest: /usr/local/libexec/vipen/ufw-rules
    owner: root
    group: root
    mode: "0700"

- name: Install database inspection helper for independent firewall runs
  ansible.builtin.copy:
    src: "{{ role_path }}/../xui/files/xui_db.py"
    dest: "{{ xui_db_tool_path }}"
    owner: root
    group: root
    mode: "0700"

- name: Discover effective subscription state before changing firewall rules
  ansible.builtin.command:
    argv: [python3, "{{ xui_db_tool_path }}", inspect, "{{ xui_db_dir }}/x-ui.db"]
  register: firewall_database
  changed_when: false
  when: not ansible_check_mode

- name: Reconcile only Vipen-owned firewall rules
  ansible.builtin.command:
    argv: [python3, /usr/local/libexec/vipen/ufw-rules]
    stdin: >-
      {{ {'ssh_port': ssh_port | int, 'ssh_cidrs': ssh_admin_cidrs,
          'tcp': (vpn_tcp_ports + ([(firewall_database.stdout | from_json).subscription_port] if (firewall_database.stdout | from_json).subscription_enabled else [])) | unique | list,
          'udp': vpn_udp_ports, 'panel_port': panel_port | int,
          'manage_defaults': firewall_manage_defaults | bool} | to_json }}
  register: firewall_reconcile
  changed_when: (firewall_reconcile.stdout | from_json).changed
  when: not ansible_check_mode

- name: Verify a fresh SSH connection before cancelling firewall rollback
  ansible.builtin.command: /usr/bin/true
  become: false
  changed_when: false
  vars:
    ansible_ssh_args: >-
      -o ControlMaster=no -o ControlPath=none -o BatchMode=yes
      -o PreferredAuthentications=publickey -o PasswordAuthentication=no
      -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes
  when:
    - firewall_reconcile.changed
    - ansible_connection | default('ssh') == 'ssh'
    - not ansible_check_mode

- name: Cancel firewall rollback after successful access verification
  ansible.builtin.systemd:
    name: vipen-firewall-rollback.timer
    state: stopped
  when:
    - firewall_reconcile.changed
    - not ansible_check_mode

- name: Configure fail2ban SSH jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      port = {{ ssh_port }}
      filter = sshd
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime = 1h
      banaction = ufw
      banaction_allports = ufw
  register: firewall_fail2ban_jail

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Restart fail2ban after jail changes
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  when:
    - firewall_fail2ban_jail.changed
    - not ansible_check_mode

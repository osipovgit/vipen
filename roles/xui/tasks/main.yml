---
- name: Require explicit credentials on a fresh installation
  ansible.builtin.assert:
    that:
      - xui_admin_username | default('') | length > 0
      - xui_admin_password | default('') | length >= 16
    fail_msg: Set xui_admin_username and a strong xui_admin_password in the encrypted secrets file for a fresh installation.
  when:
    - not preflight_existing_db.stat.exists
    - not (xui_restore_db_enabled | bool)
  no_log: true

- name: Validate requested restore on the controller before remote changes
  ansible.builtin.command:
    argv: [python3, "{{ role_path }}/files/xui_db.py", validate, "{{ xui_restore_db_local_path }}"]
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  when: xui_restore_db_enabled | bool
  no_log: true

- name: Ensure private application and helper directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ xui_compose_dir }}"
    - "{{ xui_db_dir }}"
    - "{{ xui_cert_dir }}"
    - "{{ xui_backup_dir }}"
    - /usr/local/libexec/vipen

- name: Install bounded database and deployment helpers
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/libexec/vipen/{{ item }}"
    owner: root
    group: root
    mode: "0700"
  loop: [xui_db.py, xui_deploy.py]

- name: Stage a requested restore privately
  ansible.builtin.copy:
    src: "{{ xui_restore_db_local_path }}"
    dest: "{{ xui_backup_dir }}/requested-restore.db"
    owner: root
    group: root
    mode: "0600"
  when: xui_restore_db_enabled | bool
  no_log: true

- name: Deploy with isolated trial migration and paired image and database rollback
  when: not ansible_check_mode
  block:
    - name: Execute bounded deployment with configuration on stdin
      ansible.builtin.command:
        argv: [python3, /usr/local/libexec/vipen/xui_deploy.py]
        stdin: >-
          {{ {
            'directory': xui_compose_dir, 'db_dir': xui_db_dir, 'cert_dir': xui_cert_dir,
            'backup_dir': xui_backup_dir, 'project': xui_compose_project, 'container': xui_container_name,
            'image': xui_image, 'compose': lookup('ansible.builtin.template', role_path ~ '/templates/docker-compose.yml.j2'),
            'timeout': xui_deploy_timeout_seconds, 'ssh_port': ssh_port | int,
            'restore': (xui_backup_dir ~ '/requested-restore.db') if xui_restore_db_enabled | bool else none,
            'restore_force': xui_restore_db_force | bool,
            'admin_username': xui_admin_username | default(''), 'admin_password': xui_admin_password | default(''),
            'settings': {
              'listen': xui_panel_listen, 'port': panel_port | int, 'panel_path': xui_panel_path,
              'reality_overrides': xui_reality_overrides,
              'subscription': none if xui_subscription_enabled is none else {
                'enabled': xui_subscription_enabled | bool, 'port': xui_subscription_port | int,
                'listen': xui_subscription_listen, 'path': xui_subscription_path, 'uri': xui_subscription_uri,
                'cert': '/root/cert/' ~ xui_subscription_cert_file, 'key': '/root/cert/' ~ xui_subscription_key_file
              }
            }
          } | to_json }}
      register: xui_deploy_result
      changed_when: xui_deploy_result.rc == 0 and (xui_deploy_result.stdout | from_json).changed
      failed_when: false
      no_log: true

    - name: Report deployment outcome without sensitive command output
      ansible.builtin.assert:
        that: xui_deploy_result.rc == 0
        fail_msg: >-
          Deployment failed. Inspect the private recovery bundle in {{ xui_backup_dir }}.
          Phase: {{ (xui_deploy_result.stdout | default('{}', true) | from_json).phase | default('unknown') }}.
          {{ (xui_deploy_result.stdout | default('{}', true) | from_json).message | default('Helper did not finish') }}.

    - name: Record effective listener configuration from the deployed database
      ansible.builtin.set_fact:
        xui_effective_tcp_ports: "{{ (xui_deploy_result.stdout | from_json).effective.tcp_ports }}"
        xui_effective_subscription_ports: >-
          {{ [(xui_deploy_result.stdout | from_json).effective.subscription_port]
             if (xui_deploy_result.stdout | from_json).effective.subscription_enabled else [] }}
  always:
    - name: Remove the temporary restore input
      ansible.builtin.file:
        path: "{{ xui_backup_dir }}/requested-restore.db"
        state: absent
      when: xui_restore_db_enabled | bool

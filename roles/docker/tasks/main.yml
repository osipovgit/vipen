---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
    state: present
  when: not ansible_check_mode

- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode

- name: Download Docker apt key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Set Docker apt architecture
  ansible.builtin.set_fact:
    docker_apt_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"

- name: Configure Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["{{ docker_apt_arch }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  when: not ansible_check_mode

- name: Remove legacy Docker repository after the replacement is prepared
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  when: not ansible_check_mode

- name: Refresh apt cache after Docker repo change
  ansible.builtin.apt:
    update_cache: true
  when: not ansible_check_mode

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: not ansible_check_mode

- name: Check existing Docker configuration
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: docker_config_file

- name: Read existing Docker configuration
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_config_original
  when: docker_config_file.stat.exists

- name: Merge managed Docker settings without discarding other options
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: /usr/bin/dockerd --validate --config-file %s
    content: "{{ (docker_config_original.content | default('e30=') | b64decode | from_json) | combine({'live-restore': true}) | to_nice_json }}\n"
  register: docker_daemon_config
  when: not ansible_check_mode

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  register: docker_service
  when: not ansible_check_mode

# Reload live-restore; container log limits belong to the Compose service.
- name: Reload Docker to apply daemon config changes
  ansible.builtin.service:
    name: docker
    state: reloaded
  when:
    - not ansible_check_mode
    - docker_daemon_config is changed

- name: Read effective Docker daemon config
  ansible.builtin.command: docker info --format '{% raw %}live_restore={{.LiveRestoreEnabled}} logging={{.LoggingDriver}}{% endraw %}'
  register: docker_effective_info
  changed_when: false
  when: not ansible_check_mode

- name: Assert Docker live-restore is active
  ansible.builtin.assert:
    that:
      - "'live_restore=true' in docker_effective_info.stdout"
    fail_msg: >-
      Docker live-restore is not active ({{ docker_effective_info.stdout | default('no output') }});
      daemon.json may not have been applied. Check /etc/docker/daemon.json and restart docker.
    success_msg: "Docker effective config: {{ docker_effective_info.stdout }}"
  when:
    - not ansible_check_mode
    - docker_effective_info is not skipped

---
# 1. Install all files first. Unit-file tasks notify a single daemon-reload
#    handler; the scripts do not (a script change needs a service restart, not
#    a daemon-reload).
- name: Install VPN health check script
  ansible.builtin.template:
    src: vpn-health-check.j2
    dest: "{{ vpn_monitor_script_path }}"
    owner: root
    group: root
    mode: "0755"
  register: vpn_monitor_script
  when: vpn_monitor_enabled | bool

- name: Install VPN health systemd service
  ansible.builtin.template:
    src: vpn-health.service.j2
    dest: /etc/systemd/system/vpn-health.service
    owner: root
    group: root
    mode: "0644"
  register: vpn_monitor_service
  notify: Reload systemd daemon
  when: vpn_monitor_enabled | bool

- name: Install VPN health systemd timer
  ansible.builtin.template:
    src: vpn-health.timer.j2
    dest: /etc/systemd/system/vpn-health.timer
    owner: root
    group: root
    mode: "0644"
  register: vpn_monitor_timer
  notify: Reload systemd daemon
  when: vpn_monitor_enabled | bool

- name: Install VPS host monitor script
  ansible.builtin.template:
    src: vps-host-monitor.j2
    dest: "{{ vpn_monitor_host_script_path }}"
    owner: root
    group: root
    mode: "0755"
  register: vpn_monitor_host_script
  when: vpn_monitor_host_enabled | bool

- name: Install VPS host monitor service
  ansible.builtin.template:
    src: vps-host-monitor.service.j2
    dest: /etc/systemd/system/vps-host-monitor.service
    owner: root
    group: root
    mode: "0644"
  register: vpn_monitor_host_service
  notify: Reload systemd daemon
  when: vpn_monitor_host_enabled | bool

# Alerting. The credentials file is written before the script that reads it, and
# is the only 0600 artefact in this role. Setup guide: docs/alerting.md.
- name: Ensure alert configuration directory exists
  ansible.builtin.file:
    path: "{{ vpn_monitor_alert_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: vpn_monitor_alert_enabled | bool

# no_log: the rendered file is a bot token. Ansible would otherwise print it in
# the diff on --diff runs.
- name: Install alert credentials
  ansible.builtin.template:
    src: alert.env.j2
    dest: "{{ vpn_monitor_alert_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - vpn_monitor_alert_enabled | bool
    - vpn_monitor_alert_telegram_token | length > 0

# Without credentials the file would only mislead: remove it so vpn-notify
# reports "no_config" instead of silently doing nothing with empty values.
- name: Remove alert credentials when alerting is off or unconfigured
  ansible.builtin.file:
    path: "{{ vpn_monitor_alert_env_file }}"
    state: absent
  when: >-
    not (vpn_monitor_alert_enabled | bool)
    or vpn_monitor_alert_telegram_token | length == 0

- name: Install alert notifier script
  ansible.builtin.template:
    src: vpn-notify.j2
    dest: "{{ vpn_monitor_alert_script_path }}"
    owner: root
    group: root
    mode: "0755"
  when: vpn_monitor_alert_enabled | bool

- name: Remove alert notifier script when alerting is off
  ansible.builtin.file:
    path: "{{ vpn_monitor_alert_script_path }}"
    state: absent
  when: not (vpn_monitor_alert_enabled | bool)

# Daily hypervisor digest. Requires both the monitor that produces the data and
# the notifier that delivers it, so it is gated on all three switches.
- name: Install VPS host daily digest script
  ansible.builtin.template:
    src: vps-host-daily.j2
    dest: "{{ vpn_monitor_host_daily_script_path }}"
    owner: root
    group: root
    mode: "0755"
  when: vpn_monitor_daily_enabled | bool

- name: Install VPS host daily digest service
  ansible.builtin.template:
    src: vps-host-daily.service.j2
    dest: /etc/systemd/system/vps-host-daily.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon
  when: vpn_monitor_daily_enabled | bool

- name: Install VPS host daily digest timer
  ansible.builtin.template:
    src: vps-host-daily.timer.j2
    dest: /etc/systemd/system/vps-host-daily.timer
    owner: root
    group: root
    mode: "0644"
  register: vpn_monitor_daily_timer
  notify: Reload systemd daemon
  when: vpn_monitor_daily_enabled | bool

# Turning the digest off has to actually stop it: an orphaned timer would keep
# sending reports that no variable in the repository claims to enable.
- name: Check whether a digest timer is installed
  ansible.builtin.stat:
    path: /etc/systemd/system/vps-host-daily.timer
  register: vpn_monitor_daily_timer_file
  when: not (vpn_monitor_daily_enabled | bool)

- name: Stop the digest timer when disabled
  ansible.builtin.systemd:
    name: vps-host-daily.timer
    state: stopped
    enabled: false
  when:
    - not (vpn_monitor_daily_enabled | bool)
    - vpn_monitor_daily_timer_file.stat.exists | default(false)
    - not ansible_check_mode

- name: Remove digest files when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ vpn_monitor_host_daily_script_path }}"
    - /etc/systemd/system/vps-host-daily.service
    - /etc/systemd/system/vps-host-daily.timer
  notify: Reload systemd daemon
  when: not (vpn_monitor_daily_enabled | bool)

# 2. Apply all unit-file changes with a single daemon-reload before any unit is
#    enabled or started, so systemd already knows the freshly written units.
- name: Reload systemd once for all monitor units
  ansible.builtin.meta: flush_handlers

# 3. Enable/start units.
- name: Enable and start VPN health timer
  ansible.builtin.systemd:
    name: vpn-health.timer
    enabled: true
    state: started
  when:
    - vpn_monitor_enabled | bool
    - not ansible_check_mode

# A running timer keeps its old schedule after a mere daemon-reload; restart it
# so a changed interval (vpn_monitor_interval) takes effect now. Only the .timer
# file matters here — a changed .service is picked up on the next timer tick.
- name: Restart VPN health timer after schedule changes
  ansible.builtin.systemd:
    name: vpn-health.timer
    state: restarted
  when:
    - vpn_monitor_enabled | bool
    - vpn_monitor_timer.changed
    - not ansible_check_mode

- name: Restart VPS host monitor after configuration changes
  ansible.builtin.systemd:
    name: vps-host-monitor.service
    state: restarted
  when:
    - vpn_monitor_host_enabled | bool
    - vpn_monitor_host_script.changed or vpn_monitor_host_service.changed
    - not ansible_check_mode

- name: Enable and start VPS host monitor
  ansible.builtin.systemd:
    name: vps-host-monitor.service
    enabled: true
    state: started
  when:
    - vpn_monitor_host_enabled | bool
    - not ansible_check_mode

- name: Enable and start VPS host daily digest timer
  ansible.builtin.systemd:
    name: vps-host-daily.timer
    enabled: true
    state: started
  when:
    - vpn_monitor_daily_enabled | bool
    - not ansible_check_mode

# Same reason as the health timer: a running timer keeps its old schedule
# through a daemon-reload, so a changed OnCalendar needs a restart to take hold.
- name: Restart digest timer after schedule changes
  ansible.builtin.systemd:
    name: vps-host-daily.timer
    state: restarted
  when:
    - vpn_monitor_daily_enabled | bool
    - vpn_monitor_daily_timer.changed
    - not ansible_check_mode

# 4. Diagnostic: run the health check once and surface the result.
- name: Run VPN health check once
  ansible.builtin.command: "{{ vpn_monitor_script_path }}"
  register: vpn_monitor_check
  changed_when: false
  when:
    - vpn_monitor_enabled | bool
    - not ansible_check_mode

- name: Show VPN health check result
  ansible.builtin.debug:
    msg: "{{ vpn_monitor_check.stdout_lines }}"
  when:
    - vpn_monitor_enabled | bool
    - vpn_monitor_check is defined
    - not ansible_check_mode

---
vpn_monitor_enabled: true
vpn_monitor_interval: 1min
vpn_monitor_script_path: /usr/local/sbin/vpn-health-check
vpn_monitor_container_name: 3xui_app
vpn_monitor_panel_host: 127.0.0.1
# Placeholder only: the real port comes from panel_port in secrets.yml.
vpn_monitor_panel_port: 54836
vpn_monitor_tcp_ports:
  - 443
vpn_monitor_disk_warn_percent: 85
vpn_monitor_disk_fail_percent: 95
vpn_monitor_mem_warn_mb: 128
vpn_monitor_conntrack_warn_percent: 75
# Backup freshness. 0 disables the check - use it if the scheduled backup is
# turned off, otherwise the check warns about a snapshot nobody schedules.
vpn_monitor_backup_dir: /opt/vipen/backups
vpn_monitor_backup_max_age_hours: 26
vpn_monitor_auto_restart: false
vpn_monitor_failure_threshold: 3
vpn_monitor_host_enabled: true
vpn_monitor_host_script_path: /usr/local/sbin/vps-host-monitor
vpn_monitor_host_interval_seconds: 5
vpn_monitor_host_steal_warn_percent: 5
vpn_monitor_host_delay_warn_ms: 1000
vpn_monitor_host_summary_seconds: 3600

# Daily digest of the host monitor's anomalies. Needs alerting to be enabled:
# it delivers through vpn-notify.
vpn_monitor_host_daily_enabled: false
vpn_monitor_host_daily_script_path: /usr/local/sbin/vps-host-daily
vpn_monitor_host_daily_schedule: "*-*-* 00:00:00"

# Telegram alerts. Credentials come from ansible-vault, never from here.
vpn_monitor_alert_enabled: false
vpn_monitor_alert_script_path: /usr/local/sbin/vpn-notify
vpn_monitor_alert_env_file: /etc/vipen/alert.env
vpn_monitor_alert_hostname: "{{ inventory_hostname }}"
vpn_monitor_alert_on_fail: true
vpn_monitor_alert_on_warn: true
vpn_monitor_alert_fail_after: 2
vpn_monitor_alert_repeat_fail_seconds: 3600
vpn_monitor_alert_repeat_warn_seconds: 21600
vpn_monitor_alert_timeout_seconds: 10
vpn_monitor_alert_telegram_token: ""
vpn_monitor_alert_telegram_chat_id: ""

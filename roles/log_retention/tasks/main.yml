---
- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: log_retention_enabled | bool

- name: Configure journald retention limits
  ansible.builtin.template:
    src: 99-vpn-limits.conf.j2
    dest: /etc/systemd/journald.conf.d/99-vpn-limits.conf
    owner: root
    group: root
    mode: "0644"
  register: log_retention_journald_retention_config
  when: log_retention_enabled | bool

- name: Restart journald after retention changes
  ansible.builtin.service:
    name: systemd-journald
    state: restarted
  when:
    - log_retention_enabled | bool
    - log_retention_journald_retention_config.changed
    - not ansible_check_mode

- name: Vacuum persistent journal to configured limit
  ansible.builtin.command: "journalctl --vacuum-size={{ log_retention_journald_system_max_use }}"
  register: log_retention_journald_vacuum
  changed_when: "'freed 0B' not in (log_retention_journald_vacuum.stdout + log_retention_journald_vacuum.stderr)"
  when:
    - log_retention_enabled | bool
    - not ansible_check_mode

- name: Report journald disk usage
  ansible.builtin.command: journalctl --disk-usage
  register: log_retention_journald_disk_usage
  changed_when: false
  when:
    - log_retention_enabled | bool
    - not ansible_check_mode

- name: Show journald disk usage
  ansible.builtin.debug:
    msg: "{{ log_retention_journald_disk_usage.stdout }}"
  when:
    - log_retention_enabled | bool
    - log_retention_journald_disk_usage is defined
    - not ansible_check_mode

- name: Configure btmp logrotate limits
  ansible.builtin.template:
    src: btmp.j2
    dest: /etc/logrotate.d/btmp
    owner: root
    group: root
    mode: "0644"
  when: log_retention_btmp_logrotate_enabled | bool

- name: Apply btmp logrotate policy
  ansible.builtin.command: logrotate /etc/logrotate.d/btmp
  changed_when: false
  when:
    - log_retention_btmp_logrotate_enabled | bool
    - not ansible_check_mode

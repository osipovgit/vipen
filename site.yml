---
- name: Harden and run a 3x-ui VPN server
  hosts: vpn_servers
  become: true
  gather_facts: true

  vars:
    vipen_secrets_file: "{{ lookup('ansible.builtin.first_found', [playbook_dir ~ '/inventories/production/secrets.yml', playbook_dir ~ '/inventories/production/secrets.example.yml']) }}"
  vars_files:
    - "{{ vipen_secrets_file }}"

  pre_tasks:
    # Freeze the run mode against the TARGET connection, once per play.
    # Templating this in group_vars instead would re-evaluate it per task, and
    # ansible_connection reads as "local" inside delegate_to: localhost tasks --
    # which silently skipped the off-host backup's chmod/metadata steps.
    - name: Resolve run mode once for the whole play
      ansible.builtin.set_fact:
        run_is_local: "{{ ansible_connection | default('ssh') == 'local' }}"
      tags: [always]

  roles:
    - role: preflight
      tags: [always]
    - role: base
      when: vipen_manage_host | bool
      tags: [base]
    - role: log_retention
      when: vipen_manage_host | bool
      tags: [logs]
    - role: network_tuning
      when: vipen_manage_host | bool
      tags: [network_tuning]
    - role: backup
      tags: [backup]
    - role: ssh
      when: vipen_manage_host | bool
      tags: [ssh]
    - role: docker
      when: vipen_manage_host | bool
      tags: [docker]
    - role: system_updates
      tags: [updates]
    - role: xui
      tags: [xui]
    - role: firewall
      when: vipen_manage_host | bool
      tags: [firewall]
    - role: vpn_monitor
      tags: [monitor]
    - role: healthcheck
      tags: [never, healthcheck]

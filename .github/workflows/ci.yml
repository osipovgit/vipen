---
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # pre-commit pins the linter versions (see .pre-commit-config.yaml), so CI
      # matches a local `pre-commit run`. ansible-core is needed for syntax-check
      # and to render the shell templates before they are linted.
      - run: python -m pip install --upgrade pre-commit ansible-core

      - name: pre-commit (yamllint, ansible-lint, shellcheck incl. templates, gitleaks)
        run: pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Ansible syntax-check (example inventory)
        run: >-
          ansible-playbook
          -i inventories/production/hosts.example.yml
          site.yml --syntax-check

  # The only job that runs the roles instead of reading them. Everything above
  # checks text; this checks behaviour - most importantly that a second converge
  # reports changed=0. Runners ship Docker, so no service container is needed.
  molecule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: molecule-${{ env.pythonLocation }}-${{ hashFiles('molecule/requirements.txt') }}

      - run: python -m pip install --upgrade -r molecule/requirements.txt

      # Molecule verifies the driver's collections are present before it starts,
      # so this cannot be left to the scenario's own dependency step.
      - run: ansible-galaxy collection install -r molecule/default/collections.yml

      - name: Molecule (create, converge, idempotence, verify, destroy)
        run: molecule test

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

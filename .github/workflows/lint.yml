---
name: Lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - run: python -m pip install --upgrade pre-commit

      - run: pre-commit run --all-files --show-diff-on-failure --color=always

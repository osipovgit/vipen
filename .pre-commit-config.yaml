---
# Install once: pip install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.6.0
    hooks:
      - id: ansible-lint
        files: ^(site\.yml|roles/|inventories/|tests/)

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ["--severity=error"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # The hook above only sees plain .sh files. Roughly 600 lines of bash ship as
  # Jinja templates instead - including the health check that decides whether
  # the VPN is up - so those are rendered first and checked on the result.
  - repo: local
    hooks:
      - id: shellcheck-templates
        name: shellcheck (rendered shell templates)
        entry: tests/shellcheck-templates.sh
        language: system
        pass_filenames: false
        files: ^(roles/.+\.j2|inventories/production/(group_vars/.+|secrets\.example\.yml)|tests/.+)$

---
# One scenario, four roles. The question this answers is narrow and specific:
# does a second converge report changed=0. That catches the most common class
# of Ansible defect - command/shell tasks without an honest changed_when - which
# neither yamllint nor ansible-lint can see, because it is a runtime property.
#
# Only roles that are meaningful inside a container are here. network_tuning
# (sysctl needs the host namespace), firewall (UFW/nftables), docker and xui
# (docker-in-docker for a single container) and vpn_monitor/healthcheck
# (systemd timers) are deliberately out of scope - see ROADMAP.md.
driver:
  name: docker

platforms:
  # systemd runs as PID 1 on purpose: log_retention restarts systemd-journald
  # and ssh reloads sshd, so a plain container would test a code path that
  # never runs on the real server. geerlingguy's images are built for exactly
  # this and are multi-arch, so the same scenario runs on an arm64 laptop and
  # on an amd64 CI runner.
  - name: vipen-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  env:
    # The scenario lives one level below the roles it tests.
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles

verifier:
  name: ansible

---
# Existing hosts are the default. Host-wide changes require an explicit opt-in.
# Read docs/setup.md and docs/migration.md before upgrading an existing server.
vipen_manage_host: false
vipen_require_secrets_file: true

ssh_port: "{{ ansible_port | default(22) }}"
ssh_admin_cidrs: [0.0.0.0/0, "::/0"]
ssh_authorized_keys: []
ssh_require_authorized_key: true
ssh_connection_test_required: true
ssh_local_key_login_verified: false

# The firewall never resets UFW. Only rules marked vipen-* are reconciled.
firewall_reset: false
# Only set true on a dedicated server whose default policy Vipen may own.
firewall_manage_defaults: false
vpn_tcp_ports: [443, 8443]
vpn_udp_ports: []
panel_public: false
xui_panel_listen: 127.0.0.1

backup_local_dir: "{{ playbook_dir }}/backups/{{ inventory_hostname }}/{{ ansible_facts['date_time']['iso8601_basic_short'] }}"
backup_snapshot_path: "{{ xui_backup_dir }}/x-ui.db.snapshot-{{ ansible_facts['date_time']['iso8601_basic_short'] }}"
xui_backup_timer_enabled: true
xui_backup_script_path: /usr/local/sbin/xui-backup
xui_backup_timer_schedule: daily
xui_backup_keep: 7
xui_backup_timeout_seconds: 120

# General OS updates and kernel/network changes are separate maintenance work.
system_updates_enabled: false
log_retention_enabled: true
log_retention_journald_system_max_use: 200M
log_retention_journald_system_keep_free: 1G
log_retention_journald_system_max_file_size: 50M
log_retention_journald_runtime_max_use: 50M
log_retention_btmp_logrotate_enabled: true
log_retention_btmp_logrotate_size: 25M
log_retention_btmp_logrotate_rotate: 1
network_tuning_sysctl_tuning_enabled: false
network_tuning_sysctl_settings:
  net.core.default_qdisc: fq
  net.ipv4.tcp_congestion_control: bbr
  net.netfilter.nf_conntrack_max: "65536"
network_tuning_apply_qdisc_to_default_route: false
network_tuning_allow_conntrack_decrease: false

xui_compose_dir: /opt/vipen
xui_db_dir: "{{ xui_compose_dir }}/db"
xui_cert_dir: "{{ xui_compose_dir }}/cert"
xui_backup_dir: "{{ xui_compose_dir }}/backups"
xui_container_name: 3xui_app
xui_compose_project: "{{ xui_compose_dir | basename }}"
# 2026-10-26: official v3.11.0 multi-platform OCI index.
xui_image: ghcr.io/mhsanaei/3x-ui:v3.11.0@sha256:1628adbd9bed680d25d6f714bef4a20f132105f4612ea294952f6665dad32e5b
xui_restore_db_enabled: false
xui_restore_db_local_path: ""
xui_restore_db_force: false
# null preserves existing settings; new databases always start with subscriptions off.
xui_subscription_enabled: null
xui_subscription_port: 2096
xui_subscription_listen: ""
xui_subscription_path: ""
xui_subscription_uri: ""
# Certificate/key filenames inside xui_cert_dir; required when enabling subscriptions.
xui_subscription_cert_file: ""
xui_subscription_key_file: ""
xui_reality_overrides: []
docker_log_max_size: 10m
docker_log_max_file: "3"
xui_container_cap_add: []
xui_container_fail2ban_enabled: false
xui_container_pids_limit: 512
# Set a measured memory limit for your workload; 0 means no imposed limit.
xui_container_memory_limit: "0"
xui_db_tool_path: /usr/local/libexec/vipen/xui_db.py
xui_deploy_timeout_seconds: 120

vpn_monitor_db_tool_path: "{{ xui_db_tool_path }}"
vpn_monitor_db_dir: "{{ xui_db_dir }}"
vpn_monitor_enabled: true
vpn_monitor_interval: 1min
vpn_monitor_script_path: /usr/local/sbin/vpn-health-check
vpn_monitor_container_name: "{{ xui_container_name }}"
vpn_monitor_panel_host: "{{ xui_panel_listen }}"
vpn_monitor_panel_port: "{{ panel_port }}"
# Optional extra probes; enabled DB listeners are discovered on every run.
vpn_monitor_tcp_ports: []
vpn_monitor_expect_inbounds: false
vpn_monitor_disk_warn_percent: 85
vpn_monitor_disk_fail_percent: 95
vpn_monitor_mem_warn_mb: 128
vpn_monitor_conntrack_warn_percent: 75
vpn_monitor_backup_dir: "{{ xui_backup_dir }}"
vpn_monitor_backup_max_age_hours: "{{ 26 if xui_backup_timer_enabled else 0 }}"
vpn_monitor_command_timeout_seconds: 10
vpn_monitor_service_timeout_seconds: 180
vpn_monitor_auto_restart: false
vpn_monitor_failure_threshold: 3
vpn_monitor_alert_enabled: true
vpn_monitor_alert_on_fail: true
vpn_monitor_alert_on_warn: true
vpn_monitor_alert_fail_after: 2
vpn_monitor_alert_repeat_fail_seconds: 3600
vpn_monitor_alert_repeat_warn_seconds: 21600
vpn_monitor_alert_timeout_seconds: 10
vpn_monitor_host_enabled: true
vpn_monitor_host_interval_seconds: 5
vpn_monitor_host_steal_warn_percent: 5
vpn_monitor_host_delay_warn_ms: 1000
vpn_monitor_host_summary_seconds: 3600
vpn_monitor_host_daily_enabled: true
vpn_monitor_host_daily_schedule: "*-*-* 00:00:00"
healthcheck_enabled: true
healthcheck_script_path: /usr/local/sbin/vpn-healthcheck
healthcheck_report_path: /var/log/vpn-healthcheck-report.log
healthcheck_since: 30 minutes ago
healthcheck_docker_since: 30m
healthcheck_container_name: "{{ xui_container_name }}"
healthcheck_monitor_timer_name: vpn-health.timer
healthcheck_monitor_script_path: "{{ vpn_monitor_script_path }}"

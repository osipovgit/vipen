---
# =============================================================================
#  SECRETS TEMPLATE - copy, fill in, then encrypt.
# =============================================================================
#  This file is committed and contains only placeholders. The real file is
#  secrets.yml: gitignored AND ansible-vault encrypted.
#
#      cp inventories/production/secrets.example.yml \
#         inventories/production/secrets.yml
#      # put the real values in, then:
#      ansible-vault encrypt inventories/production/secrets.yml
#
#  Run the playbook with --ask-vault-pass (or a gitignored --vault-password-file).
#  site.yml loads secrets.yml when it exists and falls back to this example
#  otherwise, so a fresh clone still runs with alerting simply switched off.
#
#  Why encrypt a file that is already gitignored? Defence in depth. This
#  repository lives under ~/Documents, which is commonly synced to iCloud or a
#  backup tool - plaintext tokens would be uploaded with it. Encryption also
#  means one careless `git add -f` cannot leak a working credential.
#
#  Full setup guide, including how to create the bot: docs/alerting.md
# =============================================================================

# -----------------------------------------------------------------------------
# Telegram alerting (roles/vpn_monitor)
# -----------------------------------------------------------------------------
# Token issued by @BotFather when you create the bot. Anyone holding it can post
# as your bot and read its messages - treat it like a password.
vpn_monitor_alert_telegram_token: ""

# Chat that receives the alerts: your user id, or a group/channel id (negative,
# e.g. -1001234567890). See docs/alerting.md for how to obtain it.
vpn_monitor_alert_telegram_chat_id: ""

# -----------------------------------------------------------------------------
# 3x-ui panel: port and URL path (roles/xui, roles/firewall, roles/vpn_monitor)
# -----------------------------------------------------------------------------
# The panel never faces the internet - it binds to 127.0.0.1 and UFW denies the
# port, so you reach it through an SSH tunnel. Both values are still kept out of
# the public repository: together they are the full address of your admin UI,
# and there is no reason to publish which port to probe and which path to try.
#
# The values below are random placeholders, not the author's. Pick your own.

# Port the panel listens on (loopback only). The playbook writes it into the
# database, denies it in UFW and probes it from the health check, so this value
# and the running panel always agree.
panel_port: 54836

# URL path of the panel: http://127.0.0.1:<panel_port>/<xui_panel_path>/
# Leave EMPTY to keep whatever is already in x-ui.db - that is the safe default
# on an existing server, and it means you never have to write the real value
# down. Set it only when you deliberately want to change the path or are
# restoring onto a fresh server. Keep the leading and trailing slash.
xui_panel_path: ""

# -----------------------------------------------------------------------------
# 3x-ui subscription (roles/xui) - OPTIONAL, leave commented unless you need it
# -----------------------------------------------------------------------------
# These are secrets: the subscription URL hands out every client config. By
# default the playbook leaves both empty and PRESERVES whatever is already in
# x-ui.db, which is what you want on an existing server.
#
# Set them only when you must define the values declaratively - typically when
# restoring onto a fresh server where the database does not have them yet.
# Changing them on a live server invalidates the subscription links your
# clients already use.
#
# xui_subscription_path: "/your-random-path/"
# xui_subscription_uri: "https://your.domain:2096/your-random-path/"
